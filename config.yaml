# ---------------------------------------------------------------- direct career APIs
bigco:
  - kind: amazon
    label: Amazon
    country: IND
    max_per_query: 300
    queries: [software development engineer, security engineer, software engineer]

  - kind: oracle_orc
    label: JPMorgan Chase
    base: https://jpmc.fa.oraclecloud.com
    site: CX_1
    location: India
    max_per_query: 200
    queries: [software engineer, cybersecurity]

  - kind: eightfold
    label: Netflix
    base: https://explore.jobs.netflix.net
    domain: netflix.com
    max_per_query: 100
    queries: [software engineer, security engineer]

# Workday tenants, all probe-verified. Descriptions are not in the list response, so
# these score on title + location alone and sit lower than boards with full JDs.
workday:
