# Job Radar — targeting config for Diya Singh (SDE / Security Engineering, 2026 grad)
# Everything here is tunable. Change a number, re-run `rescore`, see the effect immediately.

db_path: data/jobs.db

# Company boards are independent hosts, so they're fetched concurrently. Sequentially
# ~170 boards made a full run take 12 minutes, nearly all of it waiting on sockets.
fetch_workers: 12
profile_path: data/profile.json

# Score floors. Dashboard shows everything above the first, the digest only emails the second.
min_score_dashboard: 40
min_score_digest: 62

# ---------------------------------------------------------------- targeting

# The metros worth applying to. Everything else in India still gets collected but is
# pushed down (see india_offmetro), so Chennai/Kolkata/Ahmedabad/Jaipur/Kochi/Trivandrum
# are visible if she goes looking and never clutter the top of the list.
preferred_locations:
  - delhi
  - new delhi
  - ncr
  - gurgaon
  - gurugram
  - noida
  - bengaluru
  - bangalore
  - hyderabad
  - pune
  - mumbai

# Roles outside the preferred set lose points instead of being dropped, so a genuinely
# global-remote role still surfaces. Set false to stop penalising non-India locations.
# This also downgrades "Remote - USA" style postings, which are not remote from Delhi.
penalize_offshore: true

# Staffing marketplaces and AI-data-labelling shops that post thousands of listings
# titled "Software Engineer" but are not software engineering jobs.
blocked_companies:
  - alignerr
  - outlier ai
  - hackajob
  - turing.com
  - scale ai training
  - remotasks
  - uplers
  - crossover

include_internships: false   # she graduates 2026 — flip to true if she wants intern conversions
include_senior: false        # drops senior/staff/lead/manager AND levelled titles (Engineer II, SDE-2, L3)
max_years_required: 1        # fresher: a JD demanding 2+ years is rejected outright

# Google/NVIDIA run "Software Engineer, PhD, Early Career" tracks that score ~90 on
# every other signal and are closed to a BTech holder. Set true only if she ever
# wants to see them.
allow_advanced_degree_roles: false
stale_days: 30
offtitle_skill_floor: 6      # non-obvious titles need this many resume-skill hits to survive

priority_skills:
  - python
  - fastapi
  - aws
  - docker
  - terraform
  - security
  - application security
  - microservices
  - ci/cd
  - kubernetes
  - linux
  - distributed systems

dream_companies:
  - rippling
  - cloudflare
  - atlassian
  - databricks
  - stripe
  - datadog
  - crowdstrike
  - okta
  - zscaler
  - snyk
  - hackerone
  - semgrep
  - postman
  - razorpay
  - phonepe
  - google
  - microsoft
  - amazon
  - oracle

weights:
  title_match: 25
  security_bonus: 12
  junior_bonus: 15
  skill_cap: 30
  per_skill: 2.0
  per_priority_skill: 2.0
  location_match: 12
  remote_bonus: 8
  location_miss: 15
  geo_locked_remote: 12   # "Remote - USA" from an India-based applicant
  india_offmetro: 6       # in India, but not a metro she'd move to
  fresh_24h: 10
  fresh_7d: 5
  stale_penalty: 8
  dream_company: 10

# ---------------------------------------------------------------- sources

sources:
  linkedin_jobs:
    enabled: true
    keywords:
      - software engineer
      - security engineer
      - backend engineer
      - application security engineer
      - graduate software engineer
    locations:
      - India
      - Bengaluru, Karnataka, India
      - Delhi, India
    window: week          # 24h | week | month
    pages: 2              # 25 cards per page, per keyword, per location
    experience_levels:    # entry | associate | internship | mid
      - entry
      - associate
    remote_only: false

  # Needs your own LinkedIn cookie. Off by default — read the header comment in
  # jobradar/sources/linkedin_posts.py before switching it on.
  linkedin_posts:
    enabled: false
    keywords:
      - hiring software engineer india
      - hiring security engineer
      - "we are hiring backend engineer"
    date_posted: past-week
    pages: 1

  remoteok:
    enabled: true

  hn_whoishiring:
    enabled: true

  ats:
    enabled: true

  # Direct career-site APIs (Amazon, Workday tenants, JPMorgan, Netflix).
  bigco:
    enabled: true

  # Per-company LinkedIn feeds — the only route to Google/Microsoft/Apple/Meta/
  # Uber/Flipkart/Swiggy/Zepto, all of which block their own careers APIs.
  linkedin_companies:
    enabled: true
    # Keyword-scoped, or f_C returns the company's entire job board (sales, procurement,
    # trust & safety) and most requests are spent on cards the title gate throws away.
    keywords:
      - software engineer
      - security engineer
    locations: [India]
    window: month
    company_pages: 1
    experience_levels: [entry, associate]

  # Hiring posts from the named creators below. Needs a LinkedIn cookie OR Apify.
  linkedin_creators:
    enabled: false
    posts_per_profile: 10
    max_age_days: 14

  # Apify-backed scraping: creator posts + the bot-walled job boards.
  # Costs real money per run — see budget_usd. Off until you switch it on.
  apify:
    enabled: true
    budget_usd: 0.60          # hard stop per run, checked against Apify's usage API first
    posts_per_profile: 6
    max_creator_profiles: 21
    posted_limit: month       # any | 24h | week | month | 3months
    scrape_jobs: false        # LinkedIn company feeds already cover jobs for free


